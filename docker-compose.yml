version: '3.8'

services:
  db:
    image: postgres:17-alpine
    container_name: opal-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: opal_line
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
    ports:
      - "47198:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opal-backend
    restart: unless-stopped
    ports:
      - "47196:4000"
    environment:
      PORT: 4000
      # The backend defaults to loopback for safety; containers must opt in to
      # 0.0.0.0 or the published port (47196) would never reach the process.
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://postgres:${PGPASSWORD:?Set PGPASSWORD in .env}@db:5432/opal_line
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: opal_line
      PGUSER: postgres
      PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      SHOPIFY_STORE_URL: ${SHOPIFY_STORE_URL:-}
      SHOPIFY_ACCESS_TOKEN: ${SHOPIFY_ACCESS_TOKEN:-}
      SHOPIFY_API_VERSION: ${SHOPIFY_API_VERSION:-2025-10}
      SHOPIFY_WEBHOOK_SECRET: ${SHOPIFY_WEBHOOK_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      NOTIFICATION_EMAIL: ${NOTIFICATION_EMAIL:-}
      EMAIL_FROM: ${EMAIL_FROM:-Opal Line <notifications@opalline.in>}
      SILVER_RATE_API_URL: ${SILVER_RATE_API_URL:-}
      SILVER_RATE_API_KEY: ${SILVER_RATE_API_KEY:-}
      BACKUP_DIR: /app/backups
    volumes:
      - backups:/app/backups
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: nginx:alpine
    container_name: opal-frontend
    restart: unless-stopped
    ports:
      - "47197:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  pgdata:
  backups: