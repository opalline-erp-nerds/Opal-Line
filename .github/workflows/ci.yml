name: CI

on:
  push:
  workflow_dispatch:

# A newer push to the same branch supersedes the in-flight run: cancel it
# instead of paying for two full Windows installer jobs back to back.
# Master runs are never cancelled — releases watch them to completion.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  checks:
    name: Lint, typecheck, test, build
    # Pinned: ubuntu-latest migrates to Ubuntu 26 on 2026-10-19
    # (actions/runner-images#14748); keep the checks job on a stable image.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Debug npm lockfile
        run: |
          pwd
          ls -la
          git rev-parse HEAD
          git ls-files package.json package-lock.json
          node -p "require('./package-lock.json').lockfileVersion"
          
      - name: Install dependencies
        run: npm ci
        env:
          # CI never builds the desktop app here; skip the ~100 MB Electron download.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      # Runs before the other checks because it needs no dependencies and
      # should fail the build on a committed credential before anything is
      # built, logged, or cached.
      - name: Secret scan (no committed credentials)
        run: npm run scan:secrets

      - name: Lint (frontend, oxlint)
        run: npm run lint

      # The backend was never linted in CI, which is why its warning count
      # drifted unnoticed (47 -> 98 -> 97). `--max-warnings 0` makes the
      # current clean state a hard gate: any new warning fails the build
      # instead of being absorbed into a number nobody reads.
      - name: Lint (backend, oxlint --max-warnings 0)
        run: npm run lint:backend

      # The palette lives in three blocks that must agree (`:root`, `.dark`,
      # and the forced-light `@media print` block). A colour tweak can clear
      # the build and still put unreadable text on a dark page or print
      # invoices in a stale palette, so contrast is measured here.
      - name: Palette contrast (WCAG AA, light + dark + print)
        run: node scripts/check-palette.mjs

      - name: Typecheck (backend, tsc)
        run: npm run typecheck

      - name: Unit tests (backend, node --test)
        run: npm test

      # Upgrade-path regression test. Needs a real PostgreSQL, so it skips on
      # the plain unit-test step above and runs here for real. This is the test
      # that catches purchase DDL living only in the fresh-install path: without
      # it, an existing install boots "successfully" with no purchase tables.
      - name: Upgrade-path test (needs PostgreSQL)
        run: node --import tsx --test --test-force-exit "src/db/upgrade.test.ts"
        working-directory: backend
        env:
          UPGRADE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

      # Stock-transfer reliability test: real dispatch/receive/cancel routes
      # with concurrency, on a throwaway database created and bootstrapped
      # inside the test file (never the container's default database).
      - name: Stock-transfer reliability test (needs PostgreSQL)
        run: node --import tsx --test --test-force-exit "src/stockTransfers.test.ts"
        working-directory: backend
        env:
          DASHBOARD_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres_ci_transfer_scratch
          DASHBOARD_TEST_CREATE: '1'

      # Shopify product sync integration test: the real sync code (push,
      # pull, price push, inventory push) against an in-memory mock of the
      # Shopify Admin REST API, in a throwaway database. Needs PostgreSQL, so
      # it skips on the plain unit-test step and runs here for real.
      - name: Shopify sync integration test (needs PostgreSQL)
        run: node --import tsx --test --test-force-exit "src/shopify.sync.test.ts"
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

      - name: Build frontend (tsc -b && vite build)
        run: npm run build

  changes:
    name: Detect affected paths
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide whether the desktop installer e2e is needed
        id: filter
        shell: bash
        run: |
          # The Windows job tests a BUILT installer. A push that only touches
          # docs/*.md produces the same binary, so running 28 minutes of
          # install/boot/e2e on it is pure waste. Anything else — and any
          # uncertain base (force-push, first push of a branch) — runs it.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE" "$GITHUB_SHA")
          NON_DOC=$(printf '%s\n' "$CHANGED" | grep -v -E '^(docs/|[^/]+\.md$)' | head -n1 || true)
          if [ -n "$NON_DOC" ]; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
          else
            echo "desktop=false" >> "$GITHUB_OUTPUT"
          fi

      # The desktop job now starts on its own for anything that can change the
      # built app, so the only pushes left without it are the docs-only ones.
      # Say that out loud rather than leaving a silent gap.
      - name: Notify that the desktop e2e is skipped (docs only)
        if: github.event_name == 'push' && steps.filter.outputs.desktop == 'false'
        shell: bash
        run: |
          echo "::notice title=Desktop installer e2e skipped::Only docs changed in this push, so the Windows installer build and verification did not run. Any other change triggers it automatically."

  desktop-e2e:
    name: Desktop installer e2e (Windows)
    # Builds the signed installer exactly like release.yml does, silent-installs
    # it, boots the app and runs the full Playwright suite against the INSTALLED
    # app — the only environment where the bundled-PostgreSQL bootstrap and the
    # packaged backend actually execute.
    runs-on: windows-latest
    needs: [checks, changes]
    # Runs for every push whose diff can change the built app — the `changes`
    # job defines that as anything outside docs/ and root *.md, so an Electron,
    # backend, frontend, migration or workflow change always reaches the
    # installer build and its verification. A docs-only push still skips it,
    # and a manual run (Actions → CI → Run workflow) always runs it. The
    # environment below holds the run in "waiting" until the repo owner
    # approves; the required `checks` gate is unaffected.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.changes.outputs.desktop == 'true')
    environment: desktop-e2e-gate
    timeout-minutes: 90
    env:
      # Set by the first step below. A step-level `if` cannot set env, so the
      # flag is computed once and every later step reads it. Keeps the skip
      # logic in one place instead of repeating a condition on six steps.
      SIGNING_AVAILABLE: 'false'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      # Electron's runtime binary (fetched by npm's postinstall) and
      # electron-builder's NSIS tooling are NOT covered by the npm cache
      # above. Caching them takes ~2-4 min off every warm run. Restored
      # before npm ci because that is when the Electron download happens.
      - name: Cache Electron + electron-builder downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # No ELECTRON_SKIP_BINARY_DOWNLOAD here — electron-builder packages the
      # Electron runtime into the installer.
      - name: Install dependencies
        run: npm ci

      # Quit/shutdown behaviour. Lives here rather than in `checks` because it
      # is Windows-only: taskkill /T, netstat -ano and findstr do not exist on
      # the Ubuntu runner, so a step gated on runner.os in the ubuntu job can
      # only ever be skipped and would never catch the regression. Placed before
      # the installer build so a failure costs a minute, not half an hour.
      - name: Desktop shutdown test (port release on quit)
        run: npm run test:desktop

      # GitHub withholds repository secrets from Dependabot-triggered runs, so
      # on a dependency PR this job used to die at the step below with a
      # misleading failure that had nothing to do with the dependency.
      #
      # This cannot be a job-level `if`: the secrets context is not available
      # there, and referencing it makes GitHub reject the ENTIRE workflow as
      # invalid ("Unrecognized named-value: 'secrets'", actions/runner#520).
      # A step-level `if` does support secrets, so the skip is expressed here.
      # Tag pushes are unaffected - those run from the base repo and get it.
      - name: Check signing certificate is available
        id: signing
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.WIN_SIGNING_PFX_B64 }}
        run: |
          if ($env:PFX_B64) {
            'available=true' >> $env:GITHUB_OUTPUT
            'SIGNING_AVAILABLE=true' >> $env:GITHUB_ENV
          } else {
            'available=false' >> $env:GITHUB_OUTPUT
            Write-Host '::notice::WIN_SIGNING_PFX_B64 is not available to this run'
            Write-Host '::notice::Skipping the signed-installer e2e steps.'
          }

      # Same certificate dance as release.yml: the build hard-fails without a
      # cert whose subject contains "Opal Line Billing". Never import into
      # CurrentUser\Root on a headless runner — the confirmation dialog hangs
      # the job; the machine stores never prompt (runners are elevated).
      - name: Import code-signing certificate
        if: steps.signing.outputs.available == 'true'
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.WIN_SIGNING_PFX_B64 }}
          PFX_PASSWORD: ${{ secrets.WIN_SIGNING_PFX_PASSWORD }}
        run: |
          if (-not $env:PFX_B64) {
            Write-Error 'Missing repository secret WIN_SIGNING_PFX_B64 (base64 PFX of the "Opal Line Billing" code-signing cert). See .github/workflows/release.yml for how to create it.'
            exit 1
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'code-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_B64))
          $sec = if ($env:PFX_PASSWORD) { ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force } else { New-Object System.Security.SecureString }
          $cert = Import-PfxCertificate -FilePath $pfx -Password $sec -CertStoreLocation 'Cert:\CurrentUser\My'
          Remove-Item $pfx -Force
          if ($cert.Subject -notlike '*Opal Line Billing*') {
            Write-Error "Unexpected certificate subject: $($cert.Subject) (expected CN=Opal Line Billing)"
            exit 1
          }
          $cer = Join-Path $env:RUNNER_TEMP 'signing-cert.cer'
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null
          certutil -f -addstore Root $cer
          certutil -f -addstore TrustedPublisher $cer
          Remove-Item $cer -Force
          Write-Host "Imported $($cert.Subject) thumbprint=$($cert.Thumbprint)"

      - name: Build signed Windows installer
        if: env.SIGNING_AVAILABLE == 'true'
        run: npm run electron:build

      # Installs silently, verifies the extracted tree + signature + uninstall
      # entry, boots the app and probes PG 47193 / API 47192. Deliberately run
      # WITHOUT -StopAtEnd so the app keeps serving the Playwright suite below.
      - name: Installer smoke test (install + boot the app)
        if: env.SIGNING_AVAILABLE == 'true'
        shell: pwsh
        # Runners can be slow on the first Defender scan of the 145 MB
        # installer; allow 15 minutes before treating the install as stuck.
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/smoke-test-install.ps1 -InstallTimeoutSec 900

      # The generated first-run credential is surfaced through a desktop
      # dialog, which headless sessions may never show (the app then deletes
      # the credentials JSON in its finally block). The smoke test leaves the
      # app + bundled PostgreSQL running, and the backend verifies the hash
      # against the database on every login - so simply set a known password
      # (the repo's e2e default) in the live database and log in with it.
      - name: Reset admin password for the e2e suite
        if: env.SIGNING_AVAILABLE == 'true'
        shell: pwsh
        run: |
          $hash = node -e "require('argon2').hash('Opal@2026').then(h => console.log(h))"
          if (-not $hash) { Write-Error 'argon2 hash generation failed.'; exit 1 }
          $pgDir = Join-Path $env:LOCALAPPDATA 'Programs\Opal Line Billing\resources\pgsql\bin'
          $pgdata = Join-Path $env:APPDATA 'Opal Line Billing\pgdata'
          $env:PGPASSWORD = (Get-Content (Join-Path $env:APPDATA 'Opal Line Billing\.pg-password') -Raw).TrimEnd()
          $psql = Join-Path $pgDir 'psql.exe'
          $qArgs = @('-h', '127.0.0.1', '-p', '47193', '-U', 'postgres', '-d', 'opal_line', '-v', 'ON_ERROR_STOP=1', '-Atc')
          # Single-quote the SQL so PowerShell does not expand the argon2
          # hash's $-segments as variables; double any SQL single quotes.
          $sql = 'UPDATE users SET password_hash = ''' + $hash.Replace("'", "''") + ''', require_password_change = false WHERE username = ''admin'';'
          $updated = $false
          foreach ($attempt in 1..5) {
            $out = & $psql @qArgs $sql 2>&1
            if ($LASTEXITCODE -eq 0) { $updated = $true; Write-Host "psql: $out"; break }
            Write-Warning "attempt ${attempt}: $out"
            if ("$out" -match 'does not exist') {
              # The startup bootstrap has not completed on this (slow, headless)
              # runner. Show what the backend logged, restart the stack cleanly
              # (never SIGKILL PostgreSQL - stale postmaster.pid) and retry.
              Get-Content (Join-Path $env:APPDATA 'Opal Line Billing\logs\app.log') -Tail 60 -ErrorAction SilentlyContinue | Select-String -Pattern 'Bootstrap|bootstrap|error|ERROR' | ForEach-Object { Write-Host "app.log: $_" }
              Get-Process -Name 'Opal Line Billing' -ErrorAction SilentlyContinue | ForEach-Object { try { $_.Kill(); $_.WaitForExit(5000) | Out-Null } catch {} }
              # Redirect to a FILE, not a pipe: after a successful start
              # postgres.exe inherits the handle, and a piped command would
              # hang waiting for EOF. File handles are harmless and pg_ctl
              # itself exits immediately either way.
              & (Join-Path $pgDir 'pg_ctl.exe') stop -m fast -D $pgdata -w -t 120 *> (Join-Path $env:RUNNER_TEMP 'pgctl-stop.log')
              & (Join-Path $pgDir 'pg_ctl.exe') start -D $pgdata -w -t 120 *> (Join-Path $env:RUNNER_TEMP 'pgctl-start.log')
              Get-Content (Join-Path $env:RUNNER_TEMP 'pgctl-stop.log'), (Join-Path $env:RUNNER_TEMP 'pgctl-start.log') -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "pg_ctl: $_" }
              Start-Process -FilePath (Join-Path $env:LOCALAPPDATA 'Programs\Opal Line Billing\Opal Line Billing.exe')
              $deadline = (Get-Date).AddSeconds(240)
              while ((Get-Date) -lt $deadline) {
                try { if ((Invoke-WebRequest -Uri 'http://127.0.0.1:47192/api/v1/health' -UseBasicParsing -TimeoutSec 5).StatusCode -eq 200) { break } } catch { Start-Sleep -Seconds 3 }
              }
            } else {
              break
            }
          }
          if (-not $updated) { Write-Error 'psql password reset never succeeded.'; exit 1 }
          Remove-Item Env:PGPASSWORD
          try {
            $health = Invoke-WebRequest -Uri 'http://127.0.0.1:47192/api/v1/health' -UseBasicParsing -TimeoutSec 10
            if ($health.StatusCode -ne 200) { throw "health returned $($health.StatusCode)" }
          } catch {
            Write-Error "Backend not healthy after password reset: $_"
            exit 1
          }

      # Browser builds are pinned by the lockfile; re-downloading ~170 MB of
      # Chromium on every run is pure network time when the cache is warm.
      - name: Cache Playwright browsers
        if: env.SIGNING_AVAILABLE == 'true'
        uses: actions/cache@v6
        with:
          path: ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright chromium
        if: env.SIGNING_AVAILABLE == 'true'
        run: npx playwright install chromium

      - name: Playwright suite against the installed app
        if: env.SIGNING_AVAILABLE == 'true'
        shell: bash
        env:
          E2E_BASE_URL: http://127.0.0.1:47192
          E2E_USER: admin
          E2E_PASSWORD: Opal@2026
        run: npx playwright test

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-desktop-e2e
          path: |
            test-results/
            e2e/.auth/
          retention-days: 7
          if-no-files-found: ignore
